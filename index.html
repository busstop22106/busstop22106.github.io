<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작명별 (Jakmyeongbyeol) — 개발자 페이지</title>
<meta name="description" content="사주와 전통 성명학으로 아기 이름을 추천하는 앱, 작명별의 개발자 페이지입니다.">
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #14181f;
    --muted: #5b6472;
    --line: #e3e6eb;
    --accent: #1f6feb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216;
      --card: #171b21;
      --text: #e9edf3;
      --muted: #9aa4b2;
      --line: #262c35;
      --accent: #6ea8fe;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
                 "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 560px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px 28px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 26px;
    letter-spacing: -0.02em;
  }
  .sub {
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 14px;
  }
  p { margin: 0 0 16px; font-size: 15px; }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--line);
  }
  li { border-bottom: 1px solid var(--line); }
  a {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 2px;
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
  }
  a:hover .go, a:focus-visible .go { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .go { color: var(--muted); font-size: 13px; white-space: nowrap; }
  footer {
    margin-top: 24px;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>
<main>
  <h1>작명별</h1>
  <p class="sub">Jakmyeongbyeol · 아기 이름 추천 앱</p>

  <p>사주와 전통 성명학을 바탕으로 아기 이름 후보를 추천하고 점수로 평가하는 안드로이드 앱입니다.</p>

  <ul>
    <li><a href="https://play.google.com/store/apps/details?id=com.jakmyeongbyeol.app">Google Play에서 앱 보기<span class="go">Play 스토어 →</span></a></li>
    <li><a href="https://busstop22106.github.io/naming-star/privacy.html">개인정보처리방침<span class="go">보기 →</span></a></li>
    <li><a href="/app-ads.txt">app-ads.txt<span class="go">보기 →</span></a></li>
  </ul>

  <footer>© 2026 busstop22106</footer>
</main>
</body>
</html>
